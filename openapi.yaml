openapi: 3.1.0
info:
  title: Pelevo API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /notification-preferences:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Typed data: user_id, version, new_episodes, push_enabled, nullable HH:mm quiet_hours_start/end, IANA timezone, options and delivery_status (in_app_policy_enabled when notifications are enabled, otherwise preferences_only). Options include in_app_enabled/email_enabled/badge_enabled/high_priority_only booleans; types; nullable HH:mm summary_time; summary_days (0=Sunday through 6=Saturday); summary_include. Email defaults false and no summary days are assumed. Existing in-app producers enforce channel, priority and quiet hours; new episodes also enforce category and follow preferences. Deferred delivery requires the database notifications queue worker. This status does not attest worker health or enable push, email, badges or summary generation.' }
        '401': { description: Authentication required }
    patch:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, new_episodes, push_enabled, timezone]
              properties:
                version: { type: integer, minimum: 0 }
                new_episodes: { type: boolean }
                push_enabled: { type: boolean }
                timezone: { type: string, description: Valid IANA timezone }
                quiet_hours_start: { type: [string, 'null'], description: 'HH:mm; both ends required together; overnight allowed' }
                quiet_hours_end: { type: [string, 'null'], description: 'HH:mm; must differ from start; both null disables quiet hours' }
                options:
                  type: object
                  additionalProperties: false
                  properties:
                    in_app_enabled: { type: boolean }
                    email_enabled: { type: boolean }
                    badge_enabled: { type: boolean }
                    high_priority_only: { type: boolean }
                    types: { type: array, maxItems: 6, uniqueItems: true, items: { type: string, enum: [new_episodes, downloads, reminders, mentions, promotions, achievements] } }
                    summary_time: { type: [string, 'null'], description: 'HH:mm; required if any summary days are selected' }
                    summary_days: { type: array, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 } }
                    summary_include: { type: array, maxItems: 4, uniqueItems: true, items: { type: string, enum: [new_episodes, downloads, mentions, promotions] } }
      responses:
        '200': { description: Confirmed preferences with incremented version; omitted options preserved }
        '401': { description: Authentication required }
        '409': { description: VERSION_CONFLICT; reload before choosing whether to resubmit }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { description: Rate limited }
    put:
      security: [{ bearerAuth: [] }]
      description: Legacy update with the same validated fields as PATCH but an optional version. Mobile clients use PATCH with the observed version.
      responses:
        '200': { description: Preferences updated; increments the shared version }
        '401': { description: Authentication required }
        '409': { description: Supplied version is stale }
        '422': { $ref: '#/components/responses/Validation' }
  /me/following:
    get:
      security: [{ bearerAuth: [] }]
      description: 'Account-scoped followed shows. Each item has id, title, nullable author/artwork_url, notifications_enabled and followed_at. No seeded fallback.'
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 2048 } }
      responses:
        '200': { description: Array envelope with meta.cursor and meta.has_more }
        '401': { description: Authentication required }
        '422': { $ref: '#/components/responses/Validation' }
  /notifications:
    get:
      security: [{ bearerAuth: [] }]
      description: 'Account-scoped records with id/type/title/body, destination data (episode_id/show_id when present), and ISO-8601 created_at/read_at/dismissed_at. Inbox excludes dismissed records; history retains them. Meta includes cursor, has_more and total unread_count for the active inbox.'
      parameters:
        - { in: query, name: view, schema: { type: string, enum: [all, unread, mentions, history, new_episode, broadcast], default: all } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 2048 } }
      responses:
        '200': { description: Paginated array envelope; mentions includes mention/follow/reply types }
        '401': { description: Authentication required }
        '403': { description: Notifications feature disabled }
        '422': { $ref: '#/components/responses/Validation' }
  /notifications/{notification}/read:
    put:
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: notification, required: true, schema: { type: string } }
      responses:
        '200': { description: 'data.read=true; retries preserve the original read timestamp' }
        '401': { description: Authentication required }
        '403': { description: Feature disabled }
        '404': { description: Notification unavailable to this account }
  /notifications/bulk:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [read, dismiss] }
                ids: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, description: ULID } }
      responses:
        '200': { description: Confirms action and exact IDs; dismiss archives instead of deleting records }
        '401': { description: Authentication required }
        '403': { description: Feature disabled }
        '404': { description: Any unavailable ID rejects the whole batch without partial writes }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { description: Rate limited }
  /notifications/clear:
    post:
      security: [{ bearerAuth: [] }]
      description: Archives all current inbox notifications owned by this account at execution time. New arrivals after this operation remain visible; an explicit later retry is a new clear operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, const: true }
      responses:
        '200': { description: data.cleared=true and count of archived rows }
        '401': { description: Authentication required }
        '403': { description: Feature disabled }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { description: Rate limited }
  /auth/register:
    post:
      operationId: register
      description: Creates a listener and device session. An optional unique handle (3–30 ASCII letters, digits, underscores or dashes) saves the mobile username field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, device_name]
              properties:
                name: { type: string, maxLength: 100 }
                handle: { type: [string, 'null'], minLength: 3, maxLength: 30, pattern: '^[A-Za-z0-9_-]+$' }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
                device_name: { type: string, maxLength: 100 }
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '201': { description: Device session created }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/login:
    post:
      operationId: login
      responses:
        '200': { description: Authenticated }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/social:
    post:
      operationId: socialLogin
      description: Verifies an Apple or Google identity server-to-server, links the unique provider subject, and issues a device session.
      responses: { '200': { description: Authenticated }, '401': { description: Provider token invalid }, '409': { description: Provider identity already linked }, '422': { $ref: '#/components/responses/Validation' } }
  /auth/otp/send:
    post:
      operationId: sendLoginOtp
      responses: { '200': { description: Request accepted without account enumeration }, '422': { $ref: '#/components/responses/Validation' } }
  /auth/otp/verify:
    post:
      operationId: verifyLoginOtp
      responses: { '200': { description: Device session created }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      responses: { '200': { description: Request accepted without account enumeration } }
  /auth/password/reset:
    post:
      operationId: resetPassword
      responses: { '200': { description: Password reset and sessions revoked }, '401': { description: Code invalid or expired } }
  /auth/refresh:
    post:
      operationId: refreshToken
      responses:
        '200': { description: Tokens rotated }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Session revoked } }
  /me:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 'Current user with onboarded boolean, interests array, nullable profile (bio, avatar_url, locale, timezone), capabilities.creator_access, stats (following shows, creator followers, verified podcasts, owned playlists), and unread_notifications. Counts are nonnegative integers.' } }
    patch:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Profile updated }, '422': { $ref: '#/components/responses/Validation' } }
  /me/avatar:
    post:
      security: [{ bearerAuth: [] }]
      summary: Upload and re-encode the authenticated user's profile photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary, description: 'JPEG, PNG or WebP; at most 5 MiB and 2048 by 2048 pixels.' }
      responses:
        '200': { description: 'Envelope data.avatar_url is a server-relative public image URL. The public storage link must be installed in development. Original image metadata is discarded.' }
        '401': { description: Authentication required }
        '422': { $ref: '#/components/responses/Validation' }
        '503': { description: Image processing or storage unavailable }
  /me/password:
    patch: { security: [{ bearerAuth: [] }], responses: { '200': { description: Password updated and other sessions revoked }, '422': { $ref: '#/components/responses/Validation' } } }
  /me/onboarding:
    put:
      security: [{ bearerAuth: [] }]
      summary: Save onboarding interests and optional listening locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interests]
              properties:
                interests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string }
                locale: { type: string, enum: [en, fr, yo, sw, ha] }
      responses:
        '200': { description: 'Envelope data contains user_id, onboarded true, normalized interests and locale. Locale is omitted from the profile write when not sent. Interests must match the client catalog.' }
        '401': { description: Authentication required }
        '422': { $ref: '#/components/responses/Validation' }
  /me/preferences:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Envelope data contains user_id, integer version, audio_quality and boolean explicit_content/autoplay/download_wifi_only/data_saver/email_product/email_episodes/email_marketing. Absent rows return server defaults with version 0. Optional email defaults are false; security mail is unaffected.' }
        '401': { description: Authentication required }
    patch:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 0 }
                explicit_content: { type: boolean }
                autoplay: { type: boolean }
                download_wifi_only: { type: boolean }
                data_saver: { type: boolean }
                audio_quality: { type: string, enum: [low, normal, high, very_high] }
                email_product: { type: boolean }
                email_episodes: { type: boolean }
                email_marketing: { type: boolean }
      responses:
        '200': { description: 'Confirmed preferences with incremented version and native JSON booleans. Omitted fields are preserved. Saved playback preferences do not imply player support; optional email delivery is not yet implemented.' }
        '401': { description: Authentication required }
        '409': { description: VERSION_CONFLICT; reload current preferences before choosing whether to resubmit }
        '422': { $ref: '#/components/responses/Validation' }
  /me/connected-accounts:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Owner-scoped linked identities: id, provider, email, created_at. meta.user_id matches the caller. provider_subject is omitted. provider is apple or google.' } } }
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: 'Verified apple or google identity linked. Public fields match GET. Facebook is not accepted. token must verify with the provider.' }, '401': { description: SOCIAL_TOKEN_INVALID }, '409': { description: Provider identity already owned } } }
  /me/connected-accounts/{account}:
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'disconnected=true for an account owned by the caller' }, '404': { description: Account not owned by caller } } }
  /me/invite:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Owner-scoped invite: user_id, code, expires_at, redemptions and max_redemptions. code is null when none is active.' } } }
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: 'Invitation created or returned. rotate=true revokes the current code first. Public fields match GET /me/invite.' } } }
  /referrals/redeem:
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: Invitation redeemed pending qualification }, '409': { description: User already redeemed }, '422': { description: Invitation invalid } } }
  /me/data-export:
    post: { security: [{ bearerAuth: [] }], responses: { '202': { description: Private export queued } } }
  /me/delete:
    post: { security: [{ bearerAuth: [] }], responses: { '202': { description: Delayed anonymization scheduled } } }
  /me/config:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Versioned product configuration }, '304': { description: Not modified } }
  /uploads:
    post:
      operationId: createReelUpload
      security: [{ bearerAuth: [] }]
      description: Creates an expiring, signed direct-upload URL for reel media.
      responses:
        '201': { description: Upload reservation and signed URL created }
        '422': { $ref: '#/components/responses/Validation' }
  /uploads/{upload}:
    get:
      operationId: getReelUpload
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UploadId' }]
      responses:
        '200': { description: Upload processing state and trusted probe result }
        '404': { description: Upload does not exist or belongs to another user }
  /uploads/{upload}/complete:
    post:
      operationId: completeReelUpload
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UploadId' }]
      responses:
        '202': { description: Upload queued for media probing }
        '409': { description: Upload has not been received or cannot transition }
        '422': { $ref: '#/components/responses/Validation' }
  /uploads/{upload}/content:
    put:
      operationId: putReelUploadContent
      description: Signed, expiring direct upload. The signature is supplied in the query string.
      parameters: [{ $ref: '#/components/parameters/UploadId' }]
      responses:
        '200': { description: Media bytes stored and size verified }
        '410': { description: Signed upload reservation expired }
        '422': { $ref: '#/components/responses/Validation' }
  /reels:
    post:
      operationId: createReel
      security: [{ bearerAuth: [] }]
      description: Consumes one processed upload and creates a reel in pending_review.
      responses:
        '201': { description: Reel created for moderation }
        '409': { description: 'Upload is unavailable, unprocessed, or already consumed' }
        '422': { $ref: '#/components/responses/Validation' }
  /reels/drafts:
    get: { security: [{ bearerAuth: [] }], description: Cursor-paginated creator drafts as id, caption, state, show_id, episode_id, duration_ms and timestamps. CLAIM_REQUIRED without a creator profile., responses: { '200': { description: Creator reel drafts } } }
    post: { security: [{ bearerAuth: [] }], description: Creates a caption draft for a claimed show or episode. Does not publish media., responses: { '201': { description: Draft created }, '422': { $ref: '#/components/responses/Validation' } } }
  /reels/drafts/{draft}:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: Creator-owned draft }, '404': { description: Draft not found } } }
    patch: { security: [{ bearerAuth: [] }], responses: { '200': { description: Draft updated } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: Draft deleted } } }
  /reels/following:
    get: { security: [{ bearerAuth: [] }], description: Published reels from followed shows. Each item includes creator name/handle, counts, viewer liked/saved/following and optional episode title. Not-interested reels are omitted., responses: { '200': { description: Published reels from followed shows } } }
  /reels/trending:
    get: { security: [{ bearerAuth: [] }], description: Reels ranked by qualified views with the same public feed fields as for-you., responses: { '200': { description: Reels ranked by qualified views } } }
  /reels/{reel}/view-heartbeat:
    post: { security: [{ bearerAuth: [] }], responses: { '200': { description: View evidence accepted and capped-count result returned } } }
  /reels/{reel}/episode-links:
    post: { security: [{ bearerAuth: [] }], responses: { '200': { description: Creator linked episode } } }
  /comments/{comment}/pin:
    put: { security: [{ bearerAuth: [] }], responses: { '200': { description: Creator pinned the top-level comment }, '404': { description: Comment unavailable or not creator-owned } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: Creator removed the pin } } }
  /comments/{comment}/hide:
    put: { security: [{ bearerAuth: [] }], responses: { '200': { description: Creator hid a comment } } }
  /comments:
    get: { security: [{ bearerAuth: [] }], description: Visible comments for an episode or reel. Optional parent_id filters replies. sort is newest, top, or creator; invalid sort is 422. Presented fields include author, likes, replies_count and is_mine/is_creator. Hidden comments are omitted., responses: { '200': { description: Visible comment thread }, '422': { description: Invalid type, id or sort } } }
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: Comment created }, '403': { description: User is sanctioned } } }
  /comments/{comment}:
    patch: { security: [{ bearerAuth: [] }], responses: { '200': { description: Owned comment updated }, '403': { description: Edit window expired } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: Owned comment removed } } }
  /comments/{comment}/like:
    post: { security: [{ bearerAuth: [] }], responses: { '200': { description: Comment liked } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: Comment unliked } } }
  /reports:
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: Content report opened }, '409': { description: Duplicate report } } }
  /appeals:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: Caller appeal history } } }
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: Moderation appeal opened }, '409': { description: Duplicate appeal } } }
  /creators/{creator}/follow:
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: Creator followed } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: Creator unfollowed } } }
  /shows/{show}:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Public show: id, title, author, artwork_url, description, language, country_code, explicit, episodes_count, follower_count, rating_average, rating_count, following, notifications_enabled, claimed_by_viewer, categories. RSS URLs stay off the client.' }, '308': { description: Canonical show redirect } } }
  /shows/{show}/episodes:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Available episodes as id, show_id, title, description, artwork_url, duration_seconds, published_at, show_title, show_author. audio_url and guid stay off the list.' } } }
  /shows/{show}/related:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Related shows as id, title, author, artwork_url' } } }
  /shows/{show}/reviews:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Published reviews as id, rating, body, reviewer_name, created_at' } } }
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: Review published } } }
  /shows/{show}/notifications:
    put: { security: [{ bearerAuth: [] }], responses: { '200': { description: notifications_enabled }, '409': { description: NOT_FOLLOWING } } }
  /shows/{show}/rating:
    put: { security: [{ bearerAuth: [] }], responses: { '200': { description: Saved 1-5 rating } } }
  /episodes/{episode}:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Available episode including audio_url and show title/author. guid stays off the client.' }, '404': { description: Episode unavailable } } }
  /episodes/{episode}/chapters:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Chapters as id, title, starts_at_seconds' } } }
  /episodes/{episode}/transcript:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Available transcript language, format and content. source_url omitted.' }, '404': { description: Transcript not available } } }
  /episodes/{episode}/notes:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Owner note body, position_seconds and version. Empty is version 0.' } } }
    put: { security: [{ bearerAuth: [] }], responses: { '200': { description: Saved note }, '409': { description: VERSION_CONFLICT } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: deleted=true } } }
  /episodes/{episode}/queue:
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: 'Episode appended; version incremented' }, '409': { description: VERSION_CONFLICT } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Episode removed from the owner queue; version incremented' }, '404': { description: Episode is not in the queue }, '409': { description: VERSION_CONFLICT } } }
  /episodes/{episode}/downloads:
    post: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'episode_id, url, expires_at, authorization. Local file save is a client concern.' }, '403': { description: Active device required } } }
  /playback/{episode}:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Owner progress: user_id, episode_id, position_seconds, completed, version' } } }
    put: { security: [{ bearerAuth: [] }], responses: { '200': { description: Saved progress }, '409': { description: VERSION_CONFLICT } } }
  /player/session:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'episode_id, playing, playback_rate, version. user_id and device_id omitted.' } } }
    patch: { security: [{ bearerAuth: [] }], responses: { '200': { description: Confirmed player session }, '409': { description: VERSION_CONFLICT } } }
  /queue:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'version and items as queue_item_id, position, id, show_id, title, show_title, duration_seconds, artwork_url' } } }
    put: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Replaced owner queue; version and count. Same contract as PUT /queue/reorder.' }, '409': { description: VERSION_CONFLICT } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Cleared owner queue; version incremented and count=0' }, '409': { description: VERSION_CONFLICT } } }
  /queue/items:
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: 'Episode appended; version incremented' }, '409': { description: VERSION_CONFLICT } } }
  /queue/items/{item}:
    delete: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Removed queue_item_id; version incremented' }, '404': { description: Queue item not found }, '409': { description: VERSION_CONFLICT } } }
  /queue/reorder:
    put: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Replaced owner queue from episode_ids plus version; version and count' }, '409': { description: VERSION_CONFLICT } } }
  /library:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Overview counts plus compact owner playlists and collections. RSS, GUIDs and audio URLs stay off the client.' } } }
  /library/saved:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Cursor page of saved episodes as id, show_id, title, show_title, artwork_url, duration_seconds, saved_at' } } }
  /library/liked:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Cursor page of liked episodes as id, show_id, title, show_title, artwork_url, duration_seconds, reaction, reacted_at' } } }
  /library/shows:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Cursor page of followed shows as id, title, author, artwork_url, notifications_enabled, followed_at' } } }
  /library/recent:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'Cursor page of recently played episodes as id, show_id, title, show_title, artwork_url, duration_seconds, position_seconds, completed, played_at. RSS, GUID and audio_url stay off the client.' } } }
  /library/settings:
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: 'hide_completed, sort (recent|title|oldest), version' } } }
